## 1. Project Analysis & Tech Stack

An **AI-powered placement preparation & interview platform** for students and institutions. Think "Naukri + InterviewBit + Proctoring" in one platform — but with AI voice interviews, resume analysis, gap analysis, and institution-level subscription management.

| Database | Supabase (PostgreSQL) + SQLite (local dev) |
| Auth | Custom JWT-based session management |

## 5. 🔒 Security Audit

> [!CAUTION]
> Your project has **5 critical security vulnerabilities** that MUST be fixed before launch. The good news: **all fixes are FREE** — they're just code changes + free libraries.

### ✅ What You Already Have (Good Stuff)

| Area | Status | Details |
|------|--------|---------|
| **Password Hashing** | ✅ Strong | PBKDF2 with SHA-512, 100,000 iterations, random salt — industry standard |
| **Server-side API Key Proxy** | ✅ Good | Gemini, YouTube, Pexels, News, Judge0 keys stay on server — never reach browser |
| **Code Execution Sandboxing** | ✅ Good | Dangerous pattern detection (`child_process`, `subprocess`, `system()`) + max code length limit |
| **File Upload Sanitization** | ✅ Good | S3 uploads sanitize filenames, validate folder prefixes |
| **Body Size Limit** | ✅ Good | `parseBody()` rejects bodies >2MB |
| **Rekognition Image Size** | ✅ Good | Validates <5MB before sending to AWS |
| **`.env` in `.gitignore`** | ✅ Good | `.env`, `.env.local`, `.env.production` are ignored |
| **AWS Secrets Manager** | ✅ Built | `secretsManager.ts` supports AWS Parameter Store (disabled but ready) |
| **Parameterized Queries** | ✅ Mostly | Uses `?` placeholders in SQL via Supabase adapter |

### 🚨 CRITICAL Vulnerabilities (Fix Before Launch)

#### 1. 🔴 API Keys Exposed in Client Bundle (CRITICAL)

Your **Gemini, Groq, JSearch (RapidAPI), and GitHub keys** are loaded via `VITE_*` prefix — meaning they're **embedded in the JavaScript bundle anyone can download** from browser DevTools.

**Exposed keys found in frontend code:**
- `VITE_GEMINI_API_KEY` — in `src/config/apiKeys.ts`
- `VITE_GEMINI_CHATBOT_API_KEY` — in `src/utils/mitoiService.ts`
- `VITE_GEMINI_FRIEDE_API_KEY` — in `src/config/apiKeys.ts`
- `VITE_GROQ_API_KEY` (2 keys) — in `src/utils/groqService.ts`, `src/utils/auraSkillService.ts`
- `VITE_JSEARCH_RAPIDAPI_KEY` — in `src/pages/JobBoard.tsx`
- `VITE_GITHUB_API_KEY` — in `src/utils/profileAnalyzerService.ts`

**Risk:** Anyone opens DevTools → Sources → finds your API keys → uses them. You get billed.

**Fix:** Move ALL API calls through your server proxy (like you already did for YouTube/Pexels/News). **Cost: ₹0**

#### 2. 🔴 Sessions Never Expire (CRITICAL)

In `server/apiServer.ts`, sessions are created with `generateId()` and stored in a Map + DB — but **there's no expiry time, no TTL, no cleanup**. Once a token is created, it's valid **forever**.

**Risk:** If a session token is stolen (XSS, shared computer, network sniffing), the attacker has permanent access.

**Fix:** Add `created_at` check — reject tokens older than 24-48 hours. **Cost: ₹0**

#### 3. 🔴 CORS Wildcard `Access-Control-Allow-Origin: *` (HIGH)

In `server/apiServer.ts`, CORS allows **any origin**. Any website on the internet can make API calls to your backend.

**Risk:** CSRF attacks, unauthorized API access from any domain.

**Fix:** Restrict to your domain only: `Access-Control-Allow-Origin: https://vidyamitra.com`. **Cost: ₹0**

#### 4. 🔴 Hardcoded Default Passwords (HIGH)

In `server/db.ts`:
- Admin: `admin@vidyamitra.com / admin@123`
- All institutions: `institution@123`

**Risk:** Anyone who reads your code knows the admin login.

**Fix:** Remove seed data OR force password change on first login. **Cost: ₹0**

#### 5. 🔴 Hardcoded Judge0 IP Address (HIGH)

In `server/apiServer.ts`: `JUDGE0_HOST: 'http://54.234.23.242:2358'`

**Risk:** IP is publicly visible, unencrypted HTTP (not HTTPS), anyone can submit code to your Judge0 instance.

**Fix:** Put behind a domain + HTTPS + authentication. **Cost: ₹0-500**

### 🟡 Missing Security Layers (Add Before Launch)

| # | What's Missing | Risk | Fix | Cost |
|---|---------------|------|-----|------|
| 1 | **No Helmet.js** | Missing security headers (X-Frame-Options, CSP, HSTS) | `npm install helmet` + add middleware | ₹0 |
| 2 | **No Server Rate Limiting** | API abuse, brute-force login attacks | `npm install express-rate-limit` — limit 100 req/min per IP | ₹0 |
| 3 | **No CSRF Protection** | Cross-site request forgery on state-changing endpoints | Add CSRF tokens for POST/PUT/DELETE | ₹0 |
| 4 | **No Input Validation Library** | SQL injection, XSS via untrusted input | `npm install zod` — validate all request bodies | ₹0 |
| 5 | **No HTTPS Enforcement** | Tokens sent in plaintext over HTTP | Vercel/Railway handle this automatically | ₹0 |
| 6 | **No Brute-Force Protection** | Unlimited login attempts | Add login attempt counter + lockout after 5 fails | ₹0 |
| 7 | **No Content Security Policy** | XSS attacks via injected scripts | Add CSP header via Helmet | ₹0 |
| 8 | **No Audit Logging** | Can't trace who did what and when | Log auth events, admin actions to DB table | ₹0 |
| 9 | **No Data Encryption at Rest** | DB data readable if server compromised | Supabase Pro includes encryption at rest ✅ | Already in Supabase Pro |
| 10 | **No Backup Strategy** | Data loss risk | Supabase Pro = daily backups ✅ + S3 versioning | ₹0 (Supabase Pro) |

### 🔴 Problem with Current Institution Pricing

Your current plans (₹1,999 – ₹49,999/mo) are **institution-only**. You're missing the **massive B2C market** of individual students. Most EdTech revenue comes from individual subscriptions.

| **Free** | ₹0 | — | 3 AI interviews/month, 2 resume scans/month, 5 aptitude tests/month, Basic chatbot, No voice AI | Watermark on reports, No export, Ads |
| **Pro** | ₹199/mo | Monthly | 30 interviews/month, Unlimited resume scans, Unlimited aptitude, Voice AI (FRIEDE) — 5 sessions/mo, Career planner, PDF exports, Priority AI (faster responses), No ads | — |

- ₹199/mo = price of a coffee/week — affordable for any college student

- Annual plans boost retention and cash flow
- Free tier creates viral growth (students share with friends)

## 11. Investor Perspective & Pitch

### 🎓 For a College Student — What You Need to Know

#### What is a Startup?
A startup is a company designed to grow fast by solving a real problem. VidyaMitra solves: **"Indian students have no affordable, AI-powered tool to prepare for placements."**

#### What is an Investor?
Someone who gives you money in exchange for **equity** (% ownership). If VidyaMitra becomes worth ₹10 Crore, and they own 10%, their share is worth ₹1 Crore.

#### Types of Funding Stages

```
┌──────────────────────────────────────────────────────────┐
│                    FUNDING JOURNEY                        │
├──────────────────────────────────────────────────────────┤
│                                                          │
│  ⭐ YOU ARE HERE                                         │
│  ↓                                                       │
│  1. College Grant (₹10L) — Non-dilutive (no equity)     │
│  ↓                                                       │
│  2. Pre-Seed (₹25-50L) — From angels, after traction    │
│  ↓                                                       │
│  3. Seed (₹1-3 Cr) — From VCs, after PMF                │
│  ↓                                                       │
│  4. Series A (₹10-30 Cr) — For scaling                   │
│                                                          │
└──────────────────────────────────────────────────────────┘
```

#### Key Metrics Investors Will Ask About

| Metric | What It Means | Your Target (Year 1) |
|--------|--------------|---------------------|
| **MRR** | Monthly Recurring Revenue | ₹2-8 Lakhs |
| **ARR** | Annual Recurring Revenue | ₹25-96 Lakhs |
| **CAC** | Cost to Acquire 1 Customer | ₹50-200 |
| **LTV** | Lifetime Value of 1 Customer | ₹1,500-6,000 |
| **LTV/CAC** | Must be > 3x | 7.5x – 30x ✅ |
| **Churn** | % users who cancel monthly | < 5% |
| **DAU/MAU** | Daily/Monthly active users | 30%+ |
| **NPS** | Net Promoter Score | 50+ |
| **Burn Rate** | Money spent per month | ₹18,000-40,000 |
| **Runway** | Months before money runs out | 12+ months |

#### 🏆 Why VidyaMitra is Investable

**TAM (Total Addressable Market):**
- 40M+ college students in India
- ₹2,000/year × 40M = ₹80,000 Crore market

**SAM (Serviceable Available Market):**
- 5M engineering/management students actively preparing for placements
- ₹2,000/year × 5M = ₹1,000 Crore

**SOM (Serviceable Obtainable Market — Year 1-3):**
- 50,000 students + 200 institutions
- Target: ₹3.5 Crore ARR by Year 3
